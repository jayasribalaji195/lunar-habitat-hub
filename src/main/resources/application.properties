spring.application.name=lunar-habitat-hub

# ---- XAMPP MySQL connection ----
# Start Apache + MySQL in the XAMPP control panel first, then create a database
# named lunar_habitat_hub in phpMyAdmin (http://localhost/phpmyadmin) before running the app.
spring.datasource.url=jdbc:mysql://localhost:3306/lunar_habitat_hub?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-creates/updates tables from the entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
